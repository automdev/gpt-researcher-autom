[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "gpt-researcher-autom"
version = "0.1.0"
description = "GPT Researcher retriever plugin for Autom: live Google, Bing, Brave, DuckDuckGo and Yahoo results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Autom", email = "contact@autom.dev" },
]
keywords = ["gpt-researcher", "autom", "retriever", "web-search", "research", "agents"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.8,<1",
]

[project.entry-points."gpt_researcher.retrievers"]
autom = "gpt_researcher_autom:AutomSearch"

[project.urls]
Homepage = "https://www.autom.dev"
Documentation = "https://github.com/automdev/gpt-researcher-autom#readme"
Repository = "https://github.com/automdev/gpt-researcher-autom"
Issues = "https://github.com/automdev/gpt-researcher-autom/issues"

[tool.hatch.build.targets.wheel]
packages = ["gpt_researcher_autom"]

[tool.hatch.build.targets.sdist]
include = ["/gpt_researcher_autom", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
